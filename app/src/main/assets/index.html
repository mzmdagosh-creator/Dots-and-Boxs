<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dots &amp; Boxes — 5x9 Grid (1–4 Players + Combo Pulse)</title>
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-surface: #131c31;
      --bg-elevated: #1e293b;
      --border-muted: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --p1-color: #22d3ee;
      --p1-bg: rgba(34, 211, 238, 0.22);
      --p2-color: #fb7185;
      --p2-bg: rgba(251, 113, 133, 0.22);
      --p3-color: #34d399;
      --p3-bg: rgba(52, 211, 153, 0.22);
      --p4-color: #c084fc;
      --p4-bg: rgba(192, 132, 252, 0.22);
      --line-idle: #1e293b;
      --line-hover: #64748b;
      --dot-size: clamp(9px, 1.8vw, 13px);
      --box-size: clamp(26px, 7.2vw, 48px);
      --board-zoom: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #172554 0%, var(--bg-primary) 65%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    .setup-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .setup-card h1 {
      font-size: 1.9rem;
      margin-bottom: 6px;
    }

    .setup-card p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .count-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .count-btn {
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-muted);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
    }

    .count-btn.active {
      background: var(--p1-color);
      color: var(--bg-primary);
      border-color: var(--p1-color);
    }

    .player-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .input-group {
      background: var(--bg-elevated);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--border-muted);
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .letter-input {
      width: 56px;
      height: 56px;
      text-align: center;
      font-size: 1.65rem;
      font-weight: 800;
      text-transform: uppercase;
      background: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-muted);
      border-radius: 10px;
      outline: none;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      min-height: 20px;
      margin-bottom: 10px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--p1-color), #38bdf8);
      color: #0b1120;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: 18px;
      padding: 14px;
    }

    .player-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 2px solid transparent;
    }

    .player-card.active {
      border-color: var(--text-main);
    }

    .board-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    @keyframes comboZoomPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.055); box-shadow: 0 0 32px rgba(34, 211, 238, 0.45); }
      100% { transform: scale(1); }
    }

    @keyframes boxComboPulse {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.16); filter: brightness(1.45); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .board-wrapper.combo-zoom {
      animation: comboZoomPulse 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .box.combo-pulse {
      animation: boxComboPulse 0.45s ease-out;
    }

    .zoom-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .zoom-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-muted);
      background: var(--bg-elevated);
      color: var(--text-main);
      cursor: pointer;
    }

    .board-grid {
      display: grid;
      transform: scale(var(--board-zoom));
      transform-origin: top center;
      grid-template-columns: repeat(8, var(--dot-size) var(--box-size)) var(--dot-size);
      grid-template-rows: repeat(4, var(--dot-size) var(--box-size)) var(--dot-size);
      align-items: center;
      justify-items: center;
    }

    .dot {
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--text-main);
      z-index: 2;
    }

    .h-line {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--line-idle);
      cursor: pointer;
    }

    .v-line {
      width: 7px;
      height: 100%;
      border-radius: 999px;
      background: var(--line-idle);
      cursor: pointer;
    }

    .h-line:not(.claimed):hover,
    .v-line:not(.claimed):hover {
      background: var(--line-hover);
    }

    .box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: 6px;
    }

    .claimed-p1 { background: var(--p1-color) !important; }
    .claimed-p2 { background: var(--p2-color) !important; }
    .claimed-p3 { background: var(--p3-color) !important; }
    .claimed-p4 { background: var(--p4-color) !important; }

    .captured-p1 { background: var(--p1-bg); color: var(--p1-color); }
    .captured-p2 { background: var(--p2-bg); color: var(--p2-color); }
    .captured-p3 { background: var(--p3-bg); color: var(--p3-color); }
    .captured-p4 { background: var(--p4-bg); color: var(--p4-color); }
  </style>
</head>
<body>
  <section id="setup-screen" class="setup-card">
    <h1>Dots &amp; Boxes</h1>
    <p class="subtitle">5×9 Dot Grid • 1 to 4 Players</p>
    <div class="count-selector">
      <button class="count-btn" data-count="1">1P vs AI</button>
      <button class="count-btn active" data-count="2">2 Players</button>
      <button class="count-btn" data-count="3">3 Players</button>
      <button class="count-btn" data-count="4">4 Players</button>
    </div>
    <div id="inputs-container" class="player-inputs"></div>
    <div id="setup-error" class="error-msg"></div>
    <button id="start-btn" class="btn-primary">Start Game</button>
  </section>

  <main id="game-screen" class="game-container hidden">
    <header id="scoreboard" class="scoreboard"></header>
    <div id="board-wrapper" class="board-wrapper">
      <div class="zoom-bar">
        <button id="zoom-out" class="zoom-btn">Zoom -</button>
        <button id="zoom-reset" class="zoom-btn">Fit 100%</button>
        <button id="zoom-in" class="zoom-btn">Zoom +</button>
      </div>
      <div id="board-grid" class="board-grid"></div>
    </div>
  </main>

  <script>
    const DOT_ROWS = 5, DOT_COLS = 9, BOX_ROWS = 4, BOX_COLS = 8;
    let selectedMode = 2;
    let activeCount = 2;
    let letters = ['A', 'B', 'C', 'D'];
    let scores = [0, 0, 0, 0];
    let currentPlayer = 1;
    let comboCount = 0;
    let comboBoxEls = [];
    let hEdges = [], vEdges = [], boxes = [], boxElements = [];
    let zoom = 1;

    const inputsContainer = document.getElementById('inputs-container');
    const countBtns = document.querySelectorAll('.count-btn');
    const boardWrapper = document.getElementById('board-wrapper');

    function renderInputs() {
      const count = selectedMode === 1 ? 2 : selectedMode;
      inputsContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const label = (selectedMode === 1 && i === 1) ? 'AI Bot' : `Player ${i + 1}`;
        inputsContainer.innerHTML += `
          <div class="input-group">
            <label>${label}</label>
            <input class="letter-input" data-idx="${i}" maxlength="1" value="${letters[i]}" />
          </div>`;
      }
    }

    countBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        countBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMode = parseInt(btn.dataset.count, 10);
        renderInputs();
      });
    });
    renderInputs();

    document.getElementById('start-btn').addEventListener('click', () => {
      const inputs = [...document.querySelectorAll('.letter-input')];
      const vals = inputs.map(inp => inp.value.trim().toUpperCase());
      if (vals.some(v => v.length !== 1)) {
        document.getElementById('setup-error').textContent = 'Every player needs 1 letter.';
        return;
      }
      if (new Set(vals).size !== vals.length) {
        document.getElementById('setup-error').textContent = 'Letters must be unique.';
        return;
      }
      vals.forEach((v, idx) => letters[idx] = v);
      activeCount = vals.length;
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      initBoard();
    });

    function initBoard() {
      hEdges = Array.from({ length: DOT_ROWS }, () => Array(BOX_COLS).fill(0));
      vEdges = Array.from({ length: BOX_ROWS }, () => Array(DOT_COLS).fill(0));
      boxes = Array.from({ length: BOX_ROWS }, () => Array(BOX_COLS).fill(0));
      boxElements = Array.from({ length: BOX_ROWS }, () => Array(BOX_COLS).fill(null));
      scores = [0, 0, 0, 0];
      currentPlayer = 1;
      comboCount = 0;
      comboBoxEls = [];
      const grid = document.getElementById('board-grid');
      grid.innerHTML = '';

      for (let r = 0; r < DOT_ROWS * 2 - 1; r++) {
        for (let c = 0; c < DOT_COLS * 2 - 1; c++) {
          const el = document.createElement('div');
          if (r % 2 === 0 && c % 2 === 0) {
            el.className = 'dot';
          } else if (r % 2 === 0) {
            el.className = 'h-line';
            const hr = r / 2, hc = (c - 1) / 2;
            el.addEventListener('click', () => handleMove('H', hr, hc, el));
          } else if (c % 2 === 0) {
            el.className = 'v-line';
            const vr = (r - 1) / 2, vc = c / 2;
            el.addEventListener('click', () => handleMove('V', vr, vc, el));
          } else {
            el.className = 'box';
            boxElements[(r - 1) / 2][(c - 1) / 2] = el;
          }
          grid.appendChild(el);
        }
      }
      updateScoreboard();
    }

    function handleMove(type, r, c, el) {
      if (type === 'H') {
        if (hEdges[r][c] !== 0) return;
        hEdges[r][c] = currentPlayer;
      } else {
        if (vEdges[r][c] !== 0) return;
        vEdges[r][c] = currentPlayer;
      }
      el.classList.add('claimed', `claimed-p${currentPlayer}`);

      let captured = 0;
      if (type === 'H') {
        if (r > 0 && checkBox(r - 1, c)) captured++;
        if (r < BOX_ROWS && checkBox(r, c)) captured++;
      } else {
        if (c > 0 && checkBox(r, c - 1)) captured++;
        if (c < BOX_COLS && checkBox(r, c)) captured++;
      }

      if (captured > 0) {
        comboCount += captured;
        if (comboCount >= 2) {
          triggerComboPulseAndZoom();
        }
      } else {
        comboCount = 0;
        comboBoxEls = [];
        currentPlayer = (currentPlayer % activeCount) + 1;
      }
      updateScoreboard();
    }

    function checkBox(br, bc) {
      if (boxes[br][bc] !== 0) return false;
      if (hEdges[br][bc] && hEdges[br + 1][bc] && vEdges[br][bc] && vEdges[br][bc + 1]) {
        boxes[br][bc] = currentPlayer;
        scores[currentPlayer - 1]++;
        const boxEl = boxElements[br][bc];
        boxEl.textContent = letters[currentPlayer - 1];
        boxEl.classList.add(`captured-p${currentPlayer}`);
        comboBoxEls.push(boxEl);
        return true;
      }
      return false;
    }

    function triggerComboPulseAndZoom() {
      boardWrapper.classList.remove('combo-zoom');
      void boardWrapper.offsetWidth;
      boardWrapper.classList.add('combo-zoom');
      comboBoxEls.forEach(boxEl => {
        boxEl.classList.remove('combo-pulse');
        void boxEl.offsetWidth;
        boxEl.classList.add('combo-pulse');
      });
    }

    function updateScoreboard() {
      const sb = document.getElementById('scoreboard');
      sb.innerHTML = '';
      for (let i = 0; i < activeCount; i++) {
        const isTurn = currentPlayer === i + 1;
        sb.innerHTML += `
          <div class="player-card ${isTurn ? 'active' : ''}">
            <strong>P${i + 1} (${letters[i]})</strong>
            <span>${scores[i]}</span>
          </div>`;
      }
    }

    document.getElementById('zoom-out').onclick = () => {
      zoom = Math.max(0.65, zoom - 0.1);
      document.documentElement.style.setProperty('--board-zoom', zoom);
    };
    document.getElementById('zoom-in').onclick = () => {
      zoom = Math.min(1.35, zoom + 0.1);
      document.documentElement.style.setProperty('--board-zoom', zoom);
    };
    document.getElementById('zoom-reset').onclick = () => {
      zoom = 1;
      document.documentElement.style.setProperty('--board-zoom', zoom);
    };
  </script>
</body>
</html>
