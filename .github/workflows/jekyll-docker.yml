    - name: Build APK with Cordova
      run: |
        # Create a new Cordova project in a unique folder to avoid conflicts
        cordova create cordova_project com.yourname.dotsandboxes "DotsAndBoxes"
        
        # Replace default Cordova HTML with your game
        rm -rf cordova_project/www/*
        cp index.html cordova_project/www/
        
        # Add Android platform and build
        cd cordova_project
        cordova platform add android
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DotsAndBoxes-APK
        path: cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
