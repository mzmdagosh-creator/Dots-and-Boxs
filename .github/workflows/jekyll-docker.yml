name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build APK with Cordova
      run: |
        # Create a new Cordova project
        cordova create app com.yourname.dotsandboxes "DotsAndBoxes"
        
        # Replace default Cordova HTML with your game
        rm -rf app/www/*
        cp index.html app/www/
        
        # Add Android platform and build
        cd app
        cordova platform add android
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DotsAndBoxes-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
